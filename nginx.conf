server {
    listen 6767;
    server_name hideandseek-frontend;

    root /usr/share/nginx/html;
    index index.html;

    # Include default MIME types (Crucial for JS/CSS files)
    include /etc/nginx/mime.types;

    # Serve static files directly; return 404 if missing (prevents MIME type HTML fallback)
    location /assets/ {
        try_files $uri =404;
    }

    # Handle client-side routing by serving index.html for React routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
