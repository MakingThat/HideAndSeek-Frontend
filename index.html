<html class="no-js" lang="">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HideAndSeek Map test v0.2</title>
  <link rel="stylesheet" href="css/baseStyle.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/questions-overlay.css">
  <!--region Meta lines -->
  <meta name="description" content="">

  <meta property="og:title" content="">
  <meta property="og:type" content="">
  <meta property="og:url" content="">
  <meta property="og:image" content="">
  <meta property="og:image:alt" content="">

  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.png">

  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#fafafa">
  <!--endregion-->

  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet"/>
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
</head>

<body>

  <nav class="overlay-nav">
    <a href="#" id="add-area-toggle">ADD</a>
    <div id="add-area-panel" class="dropdown-panel hidden">
      <button type="button">Radar</button>
      <button type="button">Thermometer</button>
      <button type="button" class="disable">Measure</button>
      <button type="button" class="disable">Match</button>
    </div>
  </nav>

  <div id="content-map">
    <div id="map"></div>
  </div>

  <div id="radar-zone-modal" class="hidden">
    <div class="modal-content">
      <h3>Add Radar Zone</h3>

      <label>
        Radius (km) *
        <input type="number" id="rz-radius" min="0.01" step="0.01" required>
      </label>

      <label>
        Latitude (optional)
        <input type="number" id="rz-lat" step="any" placeholder="click map instead">
      </label>

      <label>
        Longitude (optional)
        <input type="number" id="rz-lng" step="any" placeholder="click map instead">
      </label>

      <div class="modal-actions">
        <button id="rz-confirm">Confirm</button>
        <button id="rz-cancel">Cancel</button>
      </div>
    </div>
  </div>

  <div id="thermometer-modal" class="hidden">
    <div class="modal-content">
      <h3>Add Thermometer</h3>

      <fieldset>
        <legend>Start Point</legend>
        <label>
          Latitude
          <input type="number" id="therm-start-lat" step="any" placeholder="click map instead">
        </label>
        <label>
          Longitude
          <input type="number" id="therm-start-lng" step="any" placeholder="click map instead">
        </label>
      </fieldset>

      <fieldset>
        <legend>End Point</legend>
        <label>
          Latitude
          <input type="number" id="therm-end-lat" step="any" placeholder="click map instead">
        </label>
        <label>
          Longitude
          <input type="number" id="therm-end-lng" step="any" placeholder="click map instead">
        </label>
      </fieldset>

      <div class="modal-actions">
        <button id="therm-confirm">Confirm</button>
        <button id="therm-cancel">Cancel</button>
      </div>
    </div>
  </div>

  <!--
  <div class="bottom-panel">
    <div class="bottom-panel-handle">

    </div>
  </div>
  -->

  <script type="module" src="js/main.js"></script>
  <script type="module" src="js/app.js"></script>

</body>

</html>
