<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lobby</title>
  <link rel="stylesheet" href="./css/lobby.css">

</head>
<body>

  <section id="auth-box" class="">
    <div class="content-box">
      <h1>Lobby</h1>

      <label>
        Username
        <input type="text" id="lobbyUsername" placeholder="username" required>
        *
      </label>

      <h2>Join new game</h2>

      <p>Choose a team to continue</p>

      <div class="button-box">
        <button id="hiderRoleSelect">Hiders</button>
        <button id="seekerRoleSelect">Seekers</button>
      </div>

      <h2>Reconnect</h2>

      <div class="button-box">
        <label>
          <input type="text" id="lobbyCode" placeholder="1234" required>
        </label>

        <button id="rejoin">Join</button>
      </div>

      <button id="toLobby" class="hidden">Lobby</button>
    </div>
  </section>

  <section id="lobby-box" class="hidden">
    <div class="content-box">
      <h1>Lobby1</h1>

      <div id="lobby-list-container">
        <h3>Players (<span id="player-count">0</span>)</h3>
        <ul id="lobby-list"></ul>
      </div>

    </div>
  </section>

  <script type="module" src="./js/lobby.js"></script>

</body>
</html>
