<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lobby</title>
  <link rel="stylesheet" href="./css/lobby.css">
  <link href="https://db.onlinewebfonts.com/c/513071b47bdba774c93a73ad16a75e3b?family=DIN+Next+LT+Arabic+Bold" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/3.46.0/tabler-icons.min.css">

</head>
<body>

<div class="background">
  <img src="/img/MapBGtest.png" alt="mapthing">
</div>

<div class="corner-box">
  <button id="devBypass" class="">Bypass</button>
</div>

<section id="auth-box" class="">
  <div class="content-box">
    <h1>Lobby</h1>

    <label class="field">
      <span>Username <span id="required-mark" aria-hidden="true">*</span></span>
      <input type="text" id="lobbyUsername" placeholder="username" required>
    </label>

    <div class="divider"></div>

    <div class="form-group">
      <h2>Join new game</h2>
      <p class="subtext">Choose a team to continue</p>
      <div class="button-box">
        <button id="hiderRoleSelect" class="role-btn role-hider"><i class="ti ti-eye-off" aria-hidden="true"></i>Hiders</button>
        <button id="seekerRoleSelect" class="role-btn role-seeker"><i class="ti ti-search" aria-hidden="true"></i>Seekers</button>
      </div>
    </div>

    <div class="form-group">
      <h2>Reconnect</h2>
      <div class="button-box reconnect-row">
        <label for="lobbyCode"></label><input type="text" id="lobbyCode" placeholder="1234" required>
        <button id="rejoin"><i class="ti ti-arrow-right" aria-hidden="true"></i>Join</button>
      </div>
    </div>

    <button id="toLobby" class="hidden">Lobby</button>

  </div>
</section>

<section id="lobby-box" class="hidden">
  <div class="content-box">
    <h1>Lobby1</h1>

    <div id="lobby-list-container">
      <h3>Players (<span id="player-count">0</span>)</h3>
      <ul id="lobby-list"></ul>
    </div>

  </div>
</section>

<script type="importmap">
  {
    "imports": {
      "@microsoft/signalr": "https://cdn.jsdelivr.net/npm/@microsoft/signalr@8.0.7/+esm"
    }
  }
</script>

<script type="module" src="./js/lobby.js"></script>

</body>
</html>
